apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: ghcr.io/acme/api:1.0.0
          envFrom:
            - configMapRef:
                name: api-config
          resources:
            requests:
              memory: 256Mi
              cpu: 100m
