apiVersion: apps/v1
kind: Deployment
metadata: {name: api}
spec:
  replicas: 1
  selector: {matchLabels: {app: api}}
  template:
    metadata: {labels: {app: api}}
    spec:
      terminationGracePeriodSeconds: 1
      containers:
        - {name: c, image: busybox:1.37, command: [sleep, "3600"]}
---
apiVersion: v1
kind: Service
metadata: {name: api}
spec: {selector: {app: api-v2}, ports: [{port: 80}]}
