# Refuses every node in the anchor's OS domain, which is every node.
apiVersion: v1
kind: Pod
metadata: {name: anchor, labels: {app: anchor}}
spec:
  containers:
    - {name: c, image: registry.k8s.io/pause:3.10}
---
apiVersion: v1
kind: Pod
metadata: {name: target, labels: {kwhy/target: "true"}}
spec:
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - {topologyKey: kubernetes.io/os, labelSelector: {matchLabels: {app: anchor}}}
  containers:
    - {name: c, image: registry.k8s.io/pause:3.10}
