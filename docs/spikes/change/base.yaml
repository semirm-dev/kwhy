apiVersion: v1
kind: ConfigMap
metadata: {name: app-env, namespace: impact}
data: {MODE: "v1"}
---
apiVersion: v1
kind: ConfigMap
metadata: {name: app-file, namespace: impact}
data: {mode.txt: "v1"}
---
apiVersion: v1
kind: ConfigMap
metadata: {name: app-sub, namespace: impact}
data: {mode.txt: "v1"}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: envuser, namespace: impact}
spec:
  replicas: 2
  selector: {matchLabels: {app: envuser}}
  template:
    metadata: {labels: {app: envuser}}
    spec:
      containers: [{name: c, image: busybox:1.36, command: [sleep, "3600"], envFrom: [{configMapRef: {name: app-env}}]}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: fileuser, namespace: impact}
spec:
  replicas: 1
  selector: {matchLabels: {app: fileuser}}
  template:
    metadata: {labels: {app: fileuser}}
    spec:
      containers: [{name: c, image: busybox:1.36, command: [sleep, "3600"], volumeMounts: [{name: cfg, mountPath: /cfg}]}]
      volumes: [{name: cfg, configMap: {name: app-file}}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: subuser, namespace: impact}
spec:
  replicas: 1
  selector: {matchLabels: {app: subuser}}
  template:
    metadata: {labels: {app: subuser}}
    spec:
      containers: [{name: c, image: busybox:1.36, command: [sleep, "3600"], volumeMounts: [{name: cfg, mountPath: /cfg/mode.txt, subPath: mode.txt}]}]
      volumes: [{name: cfg, configMap: {name: app-sub}}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: rolled, namespace: impact}
spec:
  replicas: 3
  selector: {matchLabels: {app: rolled}}
  template:
    metadata: {labels: {app: rolled}, annotations: {checksum/config: "sum-v1"}}
    spec:
      containers: [{name: c, image: busybox:1.36, command: [sleep, "3600"]}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: scaled, namespace: impact}
spec:
  replicas: 1
  selector: {matchLabels: {app: scaled}}
  template:
    metadata: {labels: {app: scaled}}
    spec:
      containers: [{name: c, image: busybox:1.36, command: [sleep, "3600"]}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: db, namespace: impact}
spec:
  replicas: 2
  serviceName: db
  selector: {matchLabels: {app: db}}
  template:
    metadata: {labels: {app: db}, annotations: {rev: "v1"}}
    spec:
      containers: [{name: c, image: busybox:1.36, command: [sleep, "3600"]}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: cache, namespace: impact}
spec:
  replicas: 1
  serviceName: cache-v1
  selector: {matchLabels: {app: cache}}
  template:
    metadata: {labels: {app: cache}}
    spec:
      containers: [{name: c, image: busybox:1.36, command: [sleep, "3600"]}]
---
apiVersion: batch/v1
kind: Job
metadata: {name: migrate, namespace: impact}
spec:
  template:
    spec:
      restartPolicy: Never
      containers: [{name: c, image: busybox:1.36, command: [echo, "migrate v1"]}]
