name: accuracy
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
jobs:
  accuracy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      # TestLatencyArgoCD runs locally only: its 5s gate is measured on 8 cores, these runners have 4.
      - run: go test -tags accuracy -run TestAccuracy -timeout 30m ./value/
