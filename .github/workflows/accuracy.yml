name: accuracy
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
jobs:
  accuracy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go test -tags accuracy -timeout 15m ./value/
