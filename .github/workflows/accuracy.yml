name: accuracy
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
jobs:
  accuracy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      # TestLatencyArgoCD is left out until one argo-cd answer fits the 2s target (about 15s today).
      - run: go test -tags accuracy -run TestAccuracy -timeout 30m ./value/
