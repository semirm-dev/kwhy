name: pod
on:
  push:
    branches: [main]
  pull_request:
    paths: [pod/**, testdata/pod/**, go.mod, .github/workflows/pod.yml]
  workflow_dispatch:
jobs:
  kind:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Kubernetes N-2..N: kwhy's first failing check per node must match the real scheduler's.
        node: [v1.35.8, v1.36.4, v1.37.0]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go install sigs.k8s.io/kind@v0.33.0
      - run: kind create cluster --name kwhy-pod --config testdata/pod/kind.yaml --image kindest/node:${{ matrix.node }} --wait 180s
      - run: go test -tags kind -run TestKindParity -timeout 15m -v ./pod/
